# GitHub Actions workflow for ELF library testing
# Builds and tests the NPU ELF library using a container image
# This workflow runs automatically on pull requests to ensure code quality
name: pre-merge-checks
run-name: Pre-merge checks for ${{ github.ref }} by @${{ github.actor }}

# Trigger this workflow on pull request events
on:
  pull_request:
    types: [opened, synchronize, edited]  # Run on PR open, update, or edit
    branches:
      - main
      - develop
      - releases/**  # Include all release branches

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Define the jobs to run in this workflow
# Use self-hosted runners with specific tags for job execution
jobs:
  build_and_test_linux:
    name: Build and Test ELF Library
    runs-on: [self-hosted, Linux, gfx, small]
    container:
      image: ger-is-registry.caas.intel.com/vpu/npu_elf/npu_elf:2026ww26
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Configure the project with CMake (enable tests, set Release mode)
      run: |
        cmake -B build \
          -DENABLE_ELF_TESTS=ON \
          -DCMAKE_BUILD_TYPE=Release
    - name: Compile the project using parallel jobs
      run: |
        cmake --build build --config Release -j$(($(nproc)-1))
    - name: Execute the test suite to verify functionality
      working-directory: build
      run: |
        ctest -C Release --output-on-failure -j$(($(nproc)-1))

  clang-format-code-style:
    name: Clang-format Code Style Check
    runs-on: [self-hosted, Linux, gfx, small]
    container:
      image: ger-is-registry.caas.intel.com/vpu/npu_elf/npu_elf:2026ww26
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Run clang-format to check code style
      run: |
        conda run --no-capture-output -n npu-elf pre-commit run clang-format --from-ref ${{ github.event.pull_request.base.sha }} --to-ref ${{ github.sha }}
